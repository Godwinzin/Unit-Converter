<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unit Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Unit Converter</h1>
        <p>Choose a category to start converting</p>
    </header>
    <main class="cards-container">
        <div class="card">
            <div class="card-inner">
                <div class="card-front">
                    <h2>Length</h2>
                    <p>Convert distance and length</p>
                    <button class="open-btn">Open</button>
                </div>

                <!-- BACK -->
                <div class="card-back">
                    <h2>Length</h2>
                    <input type="number" class="value-input" placeholder="Enter value">
                    <div class="unit-row">
                        <select class="from-unit">
                            <option value="Meters">Meters</option>
                            <option value="Feet">Feet</option>
                            <option value="Yards">Yards</option>
                            <option value="Kilometers">Kilometers</option>
                            <option value="Miles">Miles</option>
                        </select>
                        <span>to</span>
                        <select class="to-unit">
                            <option value="Meters">Meters</option>
                            <option value="Feet">Feet</option>
                            <option value="Yards">Yards</option>
                            <option value="Kilometers">Kilometers</option>
                            <option value="Miles">Miles</option>
                        </select>
                    </div>
                    <button class="convert-btn">Convert</button>
                    <p class="result"></p>
                    <button class="close-btn">Back</button>
                </div>
            </div>
        </div>

        <!-- VOLUME -->
        <div class="card">
            <div class="card-inner">
                <!-- FRONT -->
                <div class="card-front">
                    <h2>Volume</h2>
                    <p>Convert liquids and volume</p>
                    <button class="open-btn">Open</button>
                </div>

                <!-- BACK -->
                <div class="card-back">
                    <h2>Volume</h2>
                    <input type="number" class="value-input" placeholder="Enter value">
                    <div class="unit-row">
                        <select class="from-unit">
                            <option value="Liters">Liters</option>
                            <option value="Gallons">Gallons</option>
                            <option value="Milliliters">Milliliters</option>
                        </select>
                        <span>to</span>
                        <select class="to-unit">
                            <option value="Liters">Liters</option>
                            <option value="Gallons">Gallons</option>
                            <option value="Milliliters">Milliliters</option>
                        </select>
                    </div>
                    <button class="convert-btn">Convert</button>
                    <p class="result"></p>
                    <button class="close-btn">Back</button>
                </div>
            </div>
        </div>

        <!-- MASS -->
        <div class="card">
            <div class="card-inner">
                <!-- FRONT -->
                <div class="card-front">
                    <h2>Mass</h2>
                    <p>Convert mass and weight</p>
                    <button class="open-btn">Open</button>
                </div>

                <!-- BACK -->
                <div class="card-back">
                    <h2>Mass</h2>
                    <input type="number" class="value-input" placeholder="Enter value">
                    <div class="unit-row">
                        <select class="from-unit">
                            <option value="Kilograms">Kilograms</option>
                            <option value="Pounds">Pounds</option>
                            <option value="Grams">Grams</option>
                        </select>
                        <span>to</span>
                        <select class="to-unit">
                            <option value="Kilograms">Kilograms</option>
                            <option value="Pounds">Pounds</option>
                            <option value="Grams">Grams</option>
                        </select>
                    </div>
                    <button class="convert-btn">Convert</button>
                    <p class="result"></p>
                    <button class="close-btn">Back</button>
                </div>
            </div>
        </div>

        <!-- TEMPERATURE -->
        <div class="card">
            <div class="card-inner">
                <!-- FRONT -->
                <div class="card-front">
                    <h2>Temperature</h2>
                    <p>Convert temperatures</p>
                    <button class="open-btn">Open</button>
                </div>

                <!-- BACK -->
                <div class="card-back">
                    <h2>Temperature</h2>
                    <input type="number" class="value-input" placeholder="Enter value">
                    <div class="unit-row">
                        <select class="from-unit">
                            <option value="Celsius">Celsius</option>
                            <option value="Fahrenheit">Fahrenheit</option>
                            <option value="Kelvin">Kelvin</option>
                        </select>

                        <span>to</span>

                        <select class="to-unit">
                            <option value="Celsius">Celsius</option>
                            <option value="Fahrenheit">Fahrenheit</option>
                            <option value="Kelvin">Kelvin</option>
                        </select>
                    </div>
                    <button class="convert-btn">Convert</button>
                    <p class="result"></p>
                    <button class="close-btn">Back</button>
                </div>
            </div>
        </div>

        <!-- TIME -->
        <div class="card">
            <div class="card-inner">
                <!-- FRONT -->
                <div class="card-front">
                    <h2>Time</h2>
                    <p>Convert units of time</p>
                    <button class="open-btn">Open</button>
                </div>

                <!-- BACK -->
                <div class="card-back">
                    <h2>Time</h2>
                    <input type="number" class="value-input" placeholder="Enter value">
                    <div class="unit-row">
                        <select class="from-unit">
                            <option value="Seconds">Seconds</option>
                            <option value="Minutes">Minutes</option>
                            <option value="Hours">Hours</option>
                            <option value="Days">Days</option>
                        </select>
                        <span>to</span>
                        <select class="to-unit">
                            <option value="Seconds">Seconds</option>
                            <option value="Minutes">Minutes</option>
                            <option value="Hours">Hours</option>
                            <option value="Days">Days</option>
                        </select>
                    </div>
                    <button class="convert-btn">Convert</button>
                    <p class="result"></p>
                    <button class="close-btn">Back</button>
                </div>
            </div>
        </div>
    </main>

    <script src="index.js"></script>
</body>
</html>
